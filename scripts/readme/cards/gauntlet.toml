needs = "Bash, Git, Python 3, GNU `timeout`, and two reviewer CLIs signed in: Claude Code and Codex by default, Grok in either slot."
scan_needs = "Needs two signed-in reviewer CLIs (Claude Code and Codex by default). Sends the diff, and whatever the reviewers can read in the worktree, to those two model companies through your own logins."
prerequisites = true

