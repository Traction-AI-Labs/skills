# The README card for gauntlet. scripts/readme/build.py writes the card from this file; see README.md, "How this README stays right".
group = "reviews"
order = 1
tagline = "Reviews a committed code change with two models at once."
gets = "Findings from Claude and Codex by default (Grok can take either slot), merged into one verdict with each finding's file and line, and every run archived on your machine."
try = "Run a gauntlet on this branch."
