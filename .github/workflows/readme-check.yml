# Checks that the README, marketplace.json and the README's pictures are current with the plugins, once per
# finished pull request: it runs only when a label is added, and passes only when the label added is `ready`
# (adding any other label, even to a pull request already labelled ready, gives a red check).
# A push after `ready` leaves the new head with no run, so the merge stays blocked until `ready` is removed and
# added again: the commit that merges is the commit that was checked. Read any change under .github/ before
# adding `ready` (a pull request from a fork could edit this file).
name: README check

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: readme-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  readme-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run only when the ready label is added
        env:
          ADDED: ${{ github.event.label.name }}
        run: |
          if [ "$ADDED" != "ready" ]; then
            echo "::error::This check passes only when the ready label is added. Remove and re-add ready when the pull request is finished."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: README and pictures are current
        run: python3 -I scripts/readme/build.py --check
