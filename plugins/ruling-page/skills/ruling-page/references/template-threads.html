<!doctype html>
<html lang="en-AU" class="tp tp-ruling no-js">
<head>
<!--
  Ruling page, THREADS variant. Same engine and look as template.html; the data is a T array of open questions instead of D.

  Authors edit only the data script: RULER (optional), BRIEF (optional), T, and the <h1>.
  Thread fields: id, group, title, asked, when, answer, owed (empty hides it), ev,
    branches [{id, q, opts [[label, effect, downside?], ...], pick, why, flip?, multi?}]
  Each thread is one card: what was asked, the answer, what is still owed, a "Got it" button, then the
  decisions that branch off it. Branch ids stay stable (Q1a). Saved answers from the old threads template
  carry over on first load. The sample below is made up; replace all of it.
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F4F5F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F0F0F" media="(prefers-color-scheme: dark)">
<title>Open questions</title>
<script>
  document.documentElement.classList.replace("no-js", "js");
  try { var t = localStorage.getItem("reading-page:theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<style>
@layer tp {
  /* House tokens. A host page overrides any of them by setting the same name on .tp. */
  :where(.tp) {
    color-scheme: light;
    --tp-paper:#F4F5F2; --tp-surface:#FFFFFF; --tp-surface-2:#ECEEE9;
    --tp-ink:#1C232B; --tp-ink-2:#38424D; --tp-muted:#5B6570; --tp-faint:#7D868E;
    --tp-rule:#D9DED7; --tp-rule-2:#E8EBE6;
    --tp-accent:#0B6E63; --tp-accent-ink:#0A5A51; --tp-accent-tint:#E3F1EE; --tp-accent-line:#9CCBC3;
    --tp-amber:#8A5A0B; --tp-amber-tint:#F6EFD9; --tp-amber-line:#D9BF84;
    --tp-action:#FF6F61; --tp-action-hover:#FF8679; --tp-on-action:#0F0F0F; --tp-focus:#B83A2E;
    --tp-scrim:rgba(15,15,15,.72);
    --tp-serif:"Charter","Bitstream Charter","Iowan Old Style","Sitka Text",Cambria,Georgia,serif;
    --tp-sans:"Avenir Next","Avenir","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
    --tp-mono:"SF Mono",ui-monospace,Menlo,Consolas,"Liberation Mono",monospace;
    --tp-r-tag:6px; --tp-r-code:10px; --tp-r-btn:12px; --tp-r-card:16px; --tp-r-pill:999px;
    --tp-fade:120ms; --tp-bar-h:64px;
  }
  @media (prefers-color-scheme: dark) { :where(.tp):not([data-theme="light"]) {
    color-scheme: dark;
    --tp-paper:#0F0F0F; --tp-surface:#161616; --tp-surface-2:#1F1F1F;
    --tp-ink:#EDEDED; --tp-ink-2:#C4C4C4; --tp-muted:#A8A8A8; --tp-faint:#8A8A8A;
    --tp-rule:rgba(255,255,255,.14); --tp-rule-2:rgba(255,255,255,.08);
    --tp-accent:#12A594; --tp-accent-ink:#5CC9B9; --tp-accent-tint:#0C2B28; --tp-accent-line:#1F6158;
    --tp-amber:#E5C56B; --tp-amber-tint:#2A2414; --tp-amber-line:#6B5A2A;
    --tp-focus:#FF6F61; --tp-scrim:rgba(0,0,0,.8);
  } }
  :where(.tp)[data-theme="dark"] {
    color-scheme: dark;
    --tp-paper:#0F0F0F; --tp-surface:#161616; --tp-surface-2:#1F1F1F;
    --tp-ink:#EDEDED; --tp-ink-2:#C4C4C4; --tp-muted:#A8A8A8; --tp-faint:#8A8A8A;
    --tp-rule:rgba(255,255,255,.14); --tp-rule-2:rgba(255,255,255,.08);
    --tp-accent:#12A594; --tp-accent-ink:#5CC9B9; --tp-accent-tint:#0C2B28; --tp-accent-line:#1F6158;
    --tp-amber:#E5C56B; --tp-amber-tint:#2A2414; --tp-amber-line:#6B5A2A;
    --tp-focus:#FF6F61; --tp-scrim:rgba(0,0,0,.8);
  }

  .tp, .tp *, .tp *::before, .tp *::after { box-sizing:border-box; }
  .tp { background:var(--tp-paper); color:var(--tp-ink); font:16px/1.55 var(--tp-sans); -webkit-text-size-adjust:100%; text-size-adjust:100%;
        -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; scroll-padding-top:calc(var(--tp-bar-h) + 16px); }
  .tp body { margin:0; }
  .tp :focus-visible { outline:2px solid var(--tp-focus); outline-offset:2px; }
  .tp a { color:var(--tp-accent-ink); text-decoration-color:var(--tp-accent-line); text-underline-offset:.18em; }
  .tp a:hover { text-decoration-color:currentColor; }
  .tp button, .tp textarea, .tp input { font:inherit; color:inherit; }
  .tp code { font-family:var(--tp-mono); font-size:.86em; background:var(--tp-surface-2); padding:.05em .3em; border-radius:4px; overflow-wrap:anywhere; }
  .tp .tp-vh { position:absolute !important; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); clip-path:inset(50%); white-space:nowrap; }
  .tp [hidden] { display:none !important; }

  /* Buttons */
  .tp .tp-btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:44px; padding:0 16px; border-radius:var(--tp-r-btn);
                border:1px solid var(--tp-rule); background:var(--tp-surface); color:var(--tp-ink); font:600 .9rem/1.1 var(--tp-sans); cursor:pointer; white-space:nowrap;
                transition:border-color var(--tp-fade), background var(--tp-fade), color var(--tp-fade); }
  .tp .tp-btn:hover { border-color:var(--tp-accent-line); color:var(--tp-accent-ink); }
  .tp .tp-btn--go { background:var(--tp-action); border-color:var(--tp-action); color:var(--tp-on-action); }
  .tp .tp-btn--go:hover { background:var(--tp-action-hover); border-color:var(--tp-action-hover); color:var(--tp-on-action); }
  .tp .tp-btn--quiet { background:transparent; }
  .tp .tp-btn.is-armed { border-color:var(--tp-focus); color:var(--tp-focus); }
  .tp .tp-link { background:none; border:0; padding:6px 2px; min-height:44px; color:var(--tp-accent-ink); font:600 .86rem var(--tp-sans); cursor:pointer;
                 text-decoration:underline; text-decoration-color:var(--tp-accent-line); text-underline-offset:.2em; }

  /* The bar: progress strip, tally and the two actions, always in reach. */
  .tp .tp-bar { position:sticky; top:0; z-index:20; background:color-mix(in srgb, var(--tp-paper) 88%, transparent);
                -webkit-backdrop-filter:saturate(150%) blur(10px); backdrop-filter:saturate(150%) blur(10px); border-bottom:1px solid var(--tp-rule); }
  .tp .tp-bar-in { position:relative; max-width:1180px; margin:0 auto; min-height:var(--tp-bar-h); padding:10px 24px; display:flex; align-items:center; gap:12px; }
  .tp .tp-bar-title { flex:0 1 250px; min-width:0; font:400 1.05rem/1.2 var(--tp-serif); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tp .tp-strip { flex:1 1 auto; min-width:120px; max-width:440px; display:flex; align-items:center; gap:3px; height:28px; }
  .tp .tp-seg { flex:1 1 0; height:12px; border-radius:3px; cursor:pointer; box-shadow:inset 0 0 0 1.5px var(--tp-faint); transition:background var(--tp-fade); }
  .tp .tp-seg.tp-seg--gap { margin-left:9px; }
  .tp .tp-seg[data-st="part"] { background:linear-gradient(90deg, var(--tp-accent) 50%, transparent 50%); box-shadow:inset 0 0 0 1.5px var(--tp-accent); }
  .tp .tp-seg[data-st="done"] { background:var(--tp-accent); box-shadow:none; }
  .tp .tp-seg[data-ch="1"][data-st="done"] { background:var(--tp-amber); }
  .tp .tp-seg[data-ch="1"][data-st="part"] { background:linear-gradient(90deg, var(--tp-amber) 50%, transparent 50%); box-shadow:inset 0 0 0 1.5px var(--tp-amber); }
  .tp .tp-seg.is-here { outline:2px solid var(--tp-ink); outline-offset:2px; }
  .tp .tp-tally { flex:none; min-height:44px; padding:0 8px; background:none; border:0; border-radius:var(--tp-r-btn); cursor:pointer; font:500 .92rem/1.1 var(--tp-sans);
                  color:var(--tp-ink-2); font-variant-numeric:tabular-nums lining-nums; white-space:nowrap; }
  .tp .tp-tally b { color:var(--tp-ink); font-weight:700; font-size:1.06rem; }
  .tp .tp-tally:hover { background:var(--tp-surface); }
  .tp .tp-notpick { flex:none; font:600 .8rem/1 var(--tp-sans); color:var(--tp-amber); background:var(--tp-amber-tint); border-radius:var(--tp-r-pill); padding:6px 10px; white-space:nowrap; }
  .tp .tp-bar-acts { display:flex; gap:8px; margin-left:auto; flex:none; }

  /* Layout: a reading column, and a list of decisions in the margin on wide screens. */
  .tp .tp-layout { max-width:1180px; margin:0 auto; padding:0 24px; display:grid; grid-template-columns:minmax(0,1fr); }
  .tp .tp-main { min-width:0; max-width:780px; width:100%; margin:0 auto; padding-bottom:120px; }
  .tp .tp-rail { display:none; }
  @media (min-width:1100px) {
    .tp .tp-layout { grid-template-columns:240px minmax(0,780px); gap:0 56px; justify-content:center; }
    .tp .tp-main { grid-column:2; grid-row:1; margin:0; }
    .tp .tp-rail { display:block; grid-column:1; grid-row:1; position:sticky; top:calc(var(--tp-bar-h) + 1px); align-self:start;
                   max-height:calc(100vh - var(--tp-bar-h) - 1px); overflow:auto; overscroll-behavior:contain; padding:40px 4px 32px 0; scrollbar-width:thin; }
  }
  .tp .tp-rail-g { display:flex; justify-content:space-between; gap:8px; font:600 .78rem/1.3 var(--tp-sans); color:var(--tp-muted); margin:22px 0 6px 8px; }
  .tp .tp-rail-g:first-child { margin-top:0; }
  .tp .tp-rail ol { list-style:none; margin:0; padding:0; }
  .tp .tp-rail a { display:grid; grid-template-columns:12px 1.9em minmax(0,1fr); gap:8px; align-items:start; min-height:32px; padding:4px 8px; border-radius:8px;
                   color:var(--tp-ink-2); text-decoration:none; font-size:.86rem; line-height:1.25; }
  .tp .tp-rail a:hover { background:var(--tp-surface); color:var(--tp-ink); }
  .tp .tp-rail a.is-here { background:var(--tp-accent-tint); color:var(--tp-ink); font-weight:600; box-shadow:inset 0 0 0 1px var(--tp-accent-line); }
  .tp .tp-rid { font:700 .76rem var(--tp-sans); color:var(--tp-muted); }
  .tp .tp-rt { display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow:hidden; }
  .tp .tp-rail .tp-dot, .tp .tp-rail .tp-rid { margin-top:3px; }
  .tp .tp-dot { width:12px; height:12px; border-radius:50%; box-shadow:inset 0 0 0 1.5px var(--tp-faint); }
  .tp .tp-dot[data-st="part"] { background:linear-gradient(90deg, var(--tp-accent) 50%, transparent 50%); box-shadow:inset 0 0 0 1.5px var(--tp-accent); }
  .tp .tp-dot[data-st="done"] { background:var(--tp-accent); box-shadow:none; }
  .tp .tp-dot[data-ch="1"] { border-radius:2px; transform:rotate(45deg) scale(.86); }
  .tp .tp-dot[data-ch="1"][data-st="done"] { background:var(--tp-amber); }
  .tp .tp-dot[data-ch="1"][data-st="part"] { background:linear-gradient(90deg, var(--tp-amber) 50%, transparent 50%); box-shadow:inset 0 0 0 1.5px var(--tp-amber); }

  /* Opening: who it is for, the title, the brief. */
  .tp .tp-hero { padding:48px 0 4px; }
  .tp .tp-kicker { margin:0 0 12px; font:500 .92rem var(--tp-sans); color:var(--tp-muted); }
  .tp .tp-h1 { margin:0 0 16px; font:400 clamp(2.1rem, 1.4rem + 2.4vw, 3.05rem)/1.06 var(--tp-serif); letter-spacing:-.016em; max-width:20ch; text-wrap:balance; }
  .tp .tp-lede { margin:0 0 22px; font:400 1.22rem/1.5 var(--tp-serif); color:var(--tp-ink-2); max-width:58ch; text-wrap:pretty; }
  .tp .tp-how { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:12px 20px; align-items:start; padding:16px 0; border-top:1px solid var(--tp-rule); border-bottom:1px solid var(--tp-rule); }
  .tp .tp-how p { margin:0; font-size:.95rem; color:var(--tp-ink-2); max-width:62ch; }
  .tp .tp-how-tools { display:flex; align-items:center; gap:12px; }
  .tp .tp-saved { font:500 .84rem var(--tp-sans); color:var(--tp-muted); }
  .tp .tp-saved.is-unsaved { color:var(--tp-focus); font-weight:600; max-width:15em; line-height:1.35; }
  .tp .tp-brief { padding:22px 0 0; }
  .tp .tp-brief h2, .tp .tp-decided summary { font:650 1rem/1.3 var(--tp-sans); margin:0 0 8px; }
  .tp .tp-brief-body { font:400 1.04rem/1.6 var(--tp-serif); color:var(--tp-ink); max-width:64ch; }
  .tp .tp-brief-body p, .tp .tp-ctx p { margin:0 0 .8em; }
  .tp .tp-brief-body ul, .tp .tp-ctx ul { margin:0 0 .8em; padding-left:1.25em; }
  .tp .tp-brief-body li, .tp .tp-ctx li { margin:0 0 .3em; }
  .tp .tp-source { margin:4px 0 0; font-size:.92rem; }
  .tp .tp-decided { margin:20px 0 0; background:var(--tp-surface); border:1px solid var(--tp-rule); border-radius:var(--tp-r-card); }
  .tp .tp-decided > summary { list-style:none; cursor:pointer; margin:0; padding:14px 18px; display:flex; gap:12px; align-items:baseline; min-height:44px; }
  .tp .tp-decided > summary::-webkit-details-marker { display:none; }
  .tp .tp-decided > summary::before { content:""; flex:none; width:8px; height:8px; border-right:2px solid var(--tp-accent); border-bottom:2px solid var(--tp-accent);
                                      transform:translateY(-2px) rotate(-45deg); transition:transform var(--tp-fade); }
  .tp .tp-decided[open] > summary::before { transform:translateY(-3px) rotate(45deg); }
  .tp .tp-decided-sub { font-weight:500; color:var(--tp-muted); }
  .tp .tp-decided-body { padding:0 18px 16px 38px; }
  .tp .tp-decided ul { margin:0 0 12px; padding:0; list-style:none; display:grid; gap:8px; }
  .tp .tp-decided li { display:grid; grid-template-columns:minmax(0,13em) minmax(0,1fr); gap:2px 16px; font-size:.92rem; }
  .tp .tp-decided li b { font-weight:600; color:var(--tp-ink); }
  .tp .tp-decided li span { color:var(--tp-ink-2); overflow-wrap:anywhere; }

  /* Groups */
  .tp .tp-group { margin:56px 0 0; }
  .tp .tp-group-head { display:flex; align-items:baseline; justify-content:space-between; gap:16px; padding:0 0 10px; margin:0 0 18px; border-bottom:2px solid var(--tp-ink); }
  .tp .tp-group-head h2 { margin:0; font:400 1.7rem/1.15 var(--tp-serif); letter-spacing:-.01em; }
  .tp .tp-group-count { font:600 .84rem var(--tp-sans); color:var(--tp-muted); white-space:nowrap; font-variant-numeric:tabular-nums; }

  /* Cards */
  .tp .tp-card { position:relative; margin:0 0 18px; padding:22px 24px 18px 24px; background:var(--tp-surface); border:1px solid var(--tp-rule); border-radius:var(--tp-r-card); }
  .tp .tp-card:focus { outline:none; }
  .tp .tp-card:focus-visible { outline:2px solid var(--tp-focus); outline-offset:2px; }
  /* A card's state is the word in its pill (outlined, then filled once answered); the whole outline follows it. */
  .tp .tp-card { transition:border-color var(--tp-fade); }
  .tp .tp-card[data-st="part"], .tp .tp-card[data-st="done"] { border-color:var(--tp-accent-line); }
  .tp .tp-card[data-ch="1"] { border-color:color-mix(in srgb, var(--tp-amber) 50%, var(--tp-rule)); }
  .tp .tp-card-head { display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:6px 12px; align-items:baseline; }
  .tp .tp-id { font:700 .8rem/1 var(--tp-sans); font-variant-numeric:lining-nums; color:var(--tp-accent-ink); background:var(--tp-accent-tint); border-radius:var(--tp-r-tag); padding:5px 7px; white-space:nowrap; }
  .tp .tp-card-title { margin:0; font:650 1.12rem/1.32 var(--tp-sans); letter-spacing:-.005em; overflow-wrap:break-word; }
  .tp .tp-flag { display:inline-block; margin-left:6px; font:600 .74rem/1 var(--tp-sans); color:var(--tp-muted); border:1px solid var(--tp-rule); border-radius:var(--tp-r-pill); padding:4px 8px; vertical-align:2px; }
  .tp .tp-state { font:600 .76rem/1 var(--tp-sans); border-radius:var(--tp-r-pill); padding:6px 10px; white-space:nowrap; color:var(--tp-muted); box-shadow:inset 0 0 0 1px var(--tp-rule); }
  .tp .tp-state[data-st="part"] { color:var(--tp-accent-ink); box-shadow:inset 0 0 0 1px var(--tp-accent-line); }
  .tp .tp-state[data-st="done"] { color:var(--tp-accent-ink); background:var(--tp-accent-tint); box-shadow:none; }
  .tp .tp-state[data-ch="1"] { color:var(--tp-amber); background:var(--tp-amber-tint); box-shadow:none; }
  .tp .tp-q { margin:12px 0 14px; font:400 1.15rem/1.5 var(--tp-serif); color:var(--tp-ink); max-width:62ch; overflow-wrap:break-word; text-wrap:pretty; }
  .tp .tp-ctx { margin:0 0 14px; font:400 1rem/1.58 var(--tp-serif); color:var(--tp-ink-2); max-width:62ch; }
  .tp details.tp-more { margin:0 0 14px; }
  .tp details.tp-more > summary { cursor:pointer; display:inline-flex; align-items:center; gap:8px; min-height:36px; font:600 .88rem var(--tp-sans); color:var(--tp-accent-ink); list-style:none; }
  .tp details.tp-more > summary::-webkit-details-marker { display:none; }
  .tp details.tp-more > summary::before { content:""; width:7px; height:7px; border-right:2px solid currentColor; border-bottom:2px solid currentColor; transform:rotate(-45deg); transition:transform var(--tp-fade); }
  .tp details.tp-more[open] > summary::before { transform:rotate(45deg); }
  .tp details.tp-more > .tp-ctx, .tp details.tp-more > .tp-textbody { margin-top:8px; }
  .tp .tp-textbody { white-space:pre-wrap; overflow-wrap:anywhere; font:400 1rem/1.6 var(--tp-serif); background:var(--tp-paper); border:1px solid var(--tp-rule); border-radius:var(--tp-r-code); padding:12px 14px; }

  /* Thread cards (open questions): what was asked, the answer, what is owed. */
  .tp .tp-asked { margin:12px 0 10px; padding:10px 14px; background:var(--tp-surface-2); border-radius:var(--tp-r-code); font:italic 400 1.05rem/1.5 var(--tp-serif); color:var(--tp-ink-2); }
  .tp .tp-asked small, .tp .tp-answer small { display:block; font:600 .76rem/1.4 var(--tp-sans); font-style:normal; color:var(--tp-muted); margin-bottom:2px; }
  .tp .tp-answer { margin:0 0 12px; font:400 1.08rem/1.55 var(--tp-serif); max-width:62ch; }
  .tp .tp-answer p, .tp .tp-asked p { margin:0 0 .6em; }
  .tp .tp-answer p:last-child, .tp .tp-asked p:last-child { margin-bottom:0; }
  .tp .tp-owed { margin:0 0 12px; padding:10px 14px; border-radius:var(--tp-r-code); background:var(--tp-amber-tint); color:var(--tp-ink); font-size:.94rem; }
  .tp .tp-owed b { color:var(--tp-amber); }
  .tp .tp-ack { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin:4px 0 6px; }
  .tp .tp-ackbtn[aria-pressed="true"] { background:var(--tp-accent-tint); border-color:var(--tp-accent); color:var(--tp-accent-ink); }
  .tp .tp-ackbtn[aria-pressed="true"]::before { content:""; width:10px; height:5px; border-left:2px solid currentColor; border-bottom:2px solid currentColor; transform:translateY(-2px) rotate(-45deg); }
  .tp .tp-ack span { font-size:.88rem; color:var(--tp-muted); }

  /* Pictures */
  .tp .tp-frames { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:10px; margin:0 0 14px; }
  .tp .tp-frame { margin:0; padding:0; border:1px solid var(--tp-rule); border-radius:var(--tp-r-code); background:var(--tp-paper); overflow:hidden; cursor:zoom-in; text-align:left; }
  .tp .tp-frame img { display:block; width:100%; height:110px; object-fit:cover; }
  .tp .tp-frame span { display:block; padding:6px 10px 8px; font-size:.8rem; color:var(--tp-ink-2); }

  /* Questions inside a card, and their options. */
  .tp .tp-part { margin:0 0 6px; padding:0; border:0; min-width:0; }
  .tp .tp-part + .tp-part { margin-top:18px; padding-top:16px; border-top:1px solid var(--tp-rule-2); }
  .tp .tp-part-q { display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 10px; padding:0; margin:0 0 10px; font:400 1.06rem/1.45 var(--tp-serif); color:var(--tp-ink); }
  .tp .tp-pid { font:700 .78rem/1 var(--tp-sans); color:var(--tp-muted); }
  .tp .tp-hint { font:600 .76rem var(--tp-sans); color:var(--tp-muted); }
  .tp .tp-opts { display:grid; gap:8px; }
  .tp .tp-opts--compact { grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); }
  .tp .tp-opt { position:relative; display:grid; grid-template-columns:22px minmax(0,1fr); gap:0 12px; align-items:start; padding:12px 14px; min-height:48px;
                border:1px solid var(--tp-rule); border-radius:var(--tp-r-btn); background:var(--tp-surface); cursor:pointer;
                transition:border-color var(--tp-fade), background var(--tp-fade), box-shadow var(--tp-fade); }
  .tp .tp-opt:hover { border-color:var(--tp-accent-line); }

    if (p.kind === "text") return has ? noteText(v) : "not answered";
    if (!has) return (p.kind === "multi" ? p.pick.length : p.pick !== -1) ? "not answered (your pick was " + pickText(p) + ")" : "not answered";
    if (p.kind === "single") return p.opts[v][0] + (p.pick === -1 ? "" : v === p.pick ? " (your pick)" : " (NOT your pick)");
    return (v.length ? v.slice().sort().map(function (i) { return p.opts[i][0]; }).join("; ") : "none of these") + (!p.pick.length ? "" : differs(p, v) ? " (NOT your pick)" : " (your pick)");
  }
  function buildText() {
    var r = counts(), L = [];
    if (THREADS) L.push("Open questions: " + r.read + " of " + CARDS.length + " answers read, " + r.decDone + " of " + r.dec + " decisions answered" + (r.decChanged ? ", " + r.decChanged + " not your pick" : ""));
    else L.push((WHO ? "Rulings (" + WHO + "): " : "Rulings: ") + r.done + " of " + CARDS.length + " answered" + (r.changed ? ", " + r.changed + " not your pick" : ""));
    CARDS.forEach(function (c) {
      var s = S.cards[c.id], cn = hasText(s.n._) ? " | note: " + noteText(s.n._) : "";
      if (c.parts.length === 1 && c.parts[0].solo) { L.push(c.id + " " + c.title + ": " + answerText(c.parts[0], s) + cn); return; }
      L.push(c.id + " " + c.title + ":" + (THREADS ? " " + (s.a.ack ? "got it" : "not read yet") + cn : ""));
      c.parts.forEach(function (p) {
        if (p.kind === "ack" || (p.kind === "text" && !(p.key in s.a))) return;
        L.push("  " + p.id + " " + p.q + " -> " + answerText(p, s) + (hasText(s.n[p.key]) ? " | note: " + noteText(s.n[p.key]) : ""));
      });
      if (!THREADS && cn) L.push("  note: " + noteText(s.n._));
    });
    if (hasText(S.page.decided)) L.push("Already decided | note: " + noteText(S.page.decided));
    if (hasText(S.page.note)) L.push("Anything else: " + noteText(S.page.note));
    var part = CARDS.filter(function (c) { return status(c).st === "part"; }), open = CARDS.filter(function (c) { return status(c).st === "open"; });
    if (part.length) L.push("Partly answered: " + part.map(function (c) { return c.id; }).join(", "));
    if (open.length) L.push((THREADS ? "Not answered: " : "Not answered: ") + open.map(function (c) { return c.id; }).join(", "));
    return L.join("\n");
  }
  var toastT;
  function toast(msg, ms) { var t = $("toast"); t.textContent = msg; clearTimeout(toastT); toastT = setTimeout(function () { t.textContent = ""; }, ms || 2600); }
  function copyOut() {
    var text = buildText(), out = $("out"); out.textContent = text; out.hidden = false; $("tp-show").setAttribute("aria-expanded", "true"); $("tp-show").textContent = "Hide the text";
    function fallback() {
      var ok = false;
      try { var rg = doc.createRange(); rg.selectNodeContents(out); var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(rg); ok = doc.execCommand("copy"); } catch (e) { ok = false; }
      done(ok);
    }
    function done(ok) {
      if (ok) toast("Copied. Paste it into the chat.");
      else { toast("Could not copy automatically. The text is selected at the end of the page: copy it by hand.", 6000); out.scrollIntoView({ block: "center" }); }
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { done(true); }, fallback); else fallback();
  }
  $("copy").addEventListener("click", copyOut);
  $("tp-copy2").addEventListener("click", copyOut);
  $("tp-show").addEventListener("click", function () {
    var out = $("out"), show = out.hidden; out.hidden = !show; if (show) out.textContent = buildText();
    this.setAttribute("aria-expanded", show ? "true" : "false"); this.textContent = show ? "Hide the text" : "Show the text";
  });

    var n = 0;
    CARDS.forEach(function (c) {
      var list = fillable(c); if (!list.length) return; n++;
      list.forEach(function (p) { S.cards[c.id].a[p.key] = p.kind === "multi" ? p.pick.slice() : p.pick; syncPart(c, p); });
      sync(c); post(c.id);

    toast("My pick is now your answer on " + plural(n, "card", "cards") + ". Change any you disagree with.");
  });
  var armT;
  $("tp-clear").addEventListener("click", function () {
    var b = this;
    if (!b.classList.contains("is-armed")) { b.classList.add("is-armed"); b.textContent = "Press again to clear everything"; clearTimeout(armT); armT = setTimeout(function () { b.classList.remove("is-armed"); b.textContent = "Clear my answers"; }, 4000); return; }
    clearTimeout(armT); b.classList.remove("is-armed"); b.textContent = "Clear my answers";
    S = { __v: 2, cards: {}, page: {} };
    CARDS.forEach(function (c) { S.cards[c.id] = { a: {}, n: {} }; });
    $("tp-pagenote").value = ""; var dn = $("tp-decided-note"); if (dn) dn.value = "";
    here = null; renderAll(); persist(); toast("Cleared. My picks are shown again, none of them answered.");
    CARDS.forEach(function (c) { post(c.id); }); post("");
  });
  var pn = $("tp-pagenote"); pn.value = typeof S.page.note === "string" ? S.page.note : "";
  pn.addEventListener("input", function () { S.page.note = pn.value; syncAll(); persist(); post("", true); });

  /* Navigation: the tally jumps to the next card not answered; the strip and the margin list show where you are. */
  function goCard(c) {
    c.el.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
    c.el.focus({ preventScroll: true });
  }
  var here = null;
  $("tp-tally").addEventListener("click", function () {
    var start = here ? CARDS.indexOf(here) : -1;
    for (var k = 1; k <= CARDS.length; k++) { var c = CARDS[(start + k) % CARDS.length]; if (status(c).st !== "done") return goCard(c); }
    var f = $("tp-finish"); f.scrollIntoView({ block: "start" });
  });
  var io;
  function watch() {
    if (io) io.disconnect();
    if (!("IntersectionObserver" in window)) return;
    var vis = new Set();
    io = new IntersectionObserver(function (es) {
      es.forEach(function (e) { if (e.isIntersecting) vis.add(e.target); else vis.delete(e.target); });
      var top = null; CARDS.forEach(function (c) { if (!top && vis.has(c.el)) top = c; });
      if (top === here) return;
      if (here) { here.seg.classList.remove("is-here"); here.rlink.classList.remove("is-here"); here.rlink.removeAttribute("aria-current"); }
      here = top;
      if (here) { here.seg.classList.add("is-here"); here.rlink.classList.add("is-here"); here.rlink.setAttribute("aria-current", "true"); }
    }, { rootMargin: "-80px 0px -55% 0px" });
    CARDS.forEach(function (c) { io.observe(c.el); });
  }

  /* Pictures open in a dialog: arrows step, Escape closes, focus returns to the picture. */
  var lb = $("tp-lb"), lbSet = null, lbIdx = 0, lbFrom = null;
  function showFrame() {
    var f = lbSet[lbIdx]; $("tp-lb-img").src = f.src; $("tp-lb-img").alt = f.cap || "";
    $("tp-lb-cap").textContent = (f.cap || "Picture") + (lbSet.length > 1 ? " (" + (lbIdx + 1) + " of " + lbSet.length + ")" : "");
    $("tp-lb-prev").hidden = $("tp-lb-next").hidden = lbSet.length < 2;
  }
  function openFrame(set, i, from) { lbSet = set; lbIdx = i; lbFrom = from; showFrame(); if (lb.showModal) lb.showModal(); else lb.setAttribute("open", ""); $("tp-lb-close").focus(); }
  function step(n) { if (!lbSet) return; lbIdx = (lbIdx + n + lbSet.length) % lbSet.length; showFrame(); }
  $("tp-lb-close").addEventListener("click", function () { lb.close ? lb.close() : lb.removeAttribute("open"); });
  $("tp-lb-prev").addEventListener("click", function () { step(-1); });
  $("tp-lb-next").addEventListener("click", function () { step(1); });
  lb.addEventListener("close", function () { lbSet = null; if (lbFrom) lbFrom.focus(); });
  lb.addEventListener("click", function (e) { if (e.target === lb) lb.close(); });
  lb.addEventListener("keydown", function (e) { if (e.key === "ArrowRight") step(1); else if (e.key === "ArrowLeft") step(-1); });

  /* Theme: follows the system until switched; the choice is shared with the reading and call-prep pages. */
  var themeBtn = $("tp-theme");
  function isDark() { var t = root.dataset.theme; return t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; }
  function paintTheme() { var next = isDark() ? "Light" : "Dark"; themeBtn.textContent = next; themeBtn.setAttribute("aria-label", "Switch to the " + next.toLowerCase() + " theme"); }
  themeBtn.addEventListener("click", function () { var t = isDark() ? "light" : "dark"; root.dataset.theme = t; try { localStorage.setItem("reading-page:theme", t); } catch (e) {} paintTheme(); });
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", paintTheme);
  paintTheme();

  /* Opening: title, who and when, the brief, what is already decided. */
  var title = $("tp-title").textContent.trim();
  $("tp-bar-title").textContent = title;
  doc.title = (THREADS ? "Open questions: " : "Rulings: ") + title;
  $("tp-kicker").textContent = (THREADS ? "Open questions" : "Decisions") + (WHO ? " for " + WHO : "") + (INFO.date ? ", " + INFO.date : "");
  if (INFO.lede) { $("tp-lede").textContent = INFO.lede; $("tp-lede").hidden = false; }
  if (THREADS) $("tp-how").textContent = "Each card is a question you asked that isn't closed yet: what you asked, the answer, and what's still owed. Press Got it once you've read an answer, answer the decisions under it (my pick is shown dashed until you click it), then Copy my answers and paste it into the chat. Anything you skip is listed as not answered.";
  var brief = $("tp-brief");
  if (INFO.body || (INFO.decided && INFO.decided.length) || INFO.source) {
    brief.hidden = false;
    if (INFO.body) { brief.appendChild(el("h2", null, "Background")); var bb = el("div", "tp-brief-body"); prose(bb, INFO.body); brief.appendChild(bb); }
    if (Array.isArray(INFO.source) && safeHref(INFO.source[1])) { var sp = el("p", "tp-source"), sa = el("a", null, INFO.source[0] || "The full report"); sa.href = safeHref(INFO.source[1]); sp.appendChild(sa); brief.appendChild(sp); }
    if (Array.isArray(INFO.decided) && INFO.decided.length) {
      var det = el("details", "tp-decided"), sm = el("summary");
      sm.appendChild(el("span", null, "Already decided")); sm.appendChild(el("span", "tp-decided-sub", plural(INFO.decided.length, "item", "items") + ", no answer needed unless you disagree"));
      det.appendChild(sm); var body = el("div", "tp-decided-body"), ul = el("ul");
      INFO.decided.forEach(function (it) { var li = el("li"); li.appendChild(el("b", null, Array.isArray(it) ? it[0] : it)); if (Array.isArray(it) && it[1]) li.appendChild(el("span", null, it[1])); ul.appendChild(li); });
      body.appendChild(ul);
      var nl = el("label"), nt = el("textarea"); nl.appendChild(el("span", "tp-vh", "Note on what is already decided"));
      nt.id = "tp-decided-note"; nt.rows = 1; nt.placeholder = "Disagree with any of these? Say which (optional)"; nt.value = typeof S.page.decided === "string" ? S.page.decided : "";
      nt.addEventListener("input", function () { S.page.decided = nt.value; syncAll(); persist(); post("", true); });
      nl.appendChild(nt); body.appendChild(nl); det.appendChild(body); brief.appendChild(det);
    }
  }

  /* Text boxes grow with what is typed where the browser cannot do it in CSS. */
  if (!(window.CSS && CSS.supports && CSS.supports("field-sizing", "content"))) {

  /* For headless checks: the text Copy my answers would put on the clipboard. */
  window.rulingText = buildText;
})();
